[package]
name = "asusdisplay-gui"
version = "0.2.0"
edition = "2024"
description = "Native GPUI desktop & status-bar utility for ASUS monitors"
license = "MIT"

[[bin]]
name = "asusdisplay-gui"
path = "src/main.rs"

[dependencies]
asusdisplay = { path = ".." }
async-channel = "2"
gpui = { package = "gpui-ce", version = "0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3.0", features = ["wayland", "x11", "font-kit"] }
# Already in the tree through gpui; decodes the app icon for the window and tray.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
